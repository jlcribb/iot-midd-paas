# Mosquitto 2.x — IoT Middleware (desarrollo)
# ============================================
# Escucha en todas las interfaces del contenedor (necesario para la red de Docker).
# Persistencia en /mosquitto/data (volumen mosquitto_data en docker-compose.yaml).

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# Logs en la salida estándar → visibles con: docker logs mosquitto
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Estado persistente (ruta escribible dentro de la imagen eclipse-mosquitto)
persistence true
persistence_location /mosquitto/data/

# Límite razonable para IoT
max_connections 1000
max_keepalive 65535
