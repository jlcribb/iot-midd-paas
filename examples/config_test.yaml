# Configuración de Prueba del IoT Middleware
# Archivo: config_test.yaml

# Configuración del broker MQTT
mqtt:
  broker:
    host: "mosquitto"
    port: 1883
    keepalive: 60
    username: null
    password: null
  topics:
    subscribe: ["iot/+/+/data", "iot/+/+/status"]
    publish: ["iot/+/+/response", "iot/+/+/command"]
  qos: 1
  retain: false

# Configuración de InfluxDB
influxdb:
  url: "http://influxdb:8086"
  token: "dev-token"
  org: "my-org"
  bucket: "iot"
  retention_policy: "30d"
  batch_size: 1000
  flush_interval: 10

# Configuración de PostgreSQL
postgresql:
  host: "postgresql"
  port: 5432
  database: "iot_middleware"
  username: "iot_user"
  password: "iot_password_2024"
  db_schema: "iot_schema"
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600

# Configuración de la API
api:
  host: "0.0.0.0"
  port: 8000
  debug: true
  cors:
    origins: ["*"]
    methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    headers: ["*"]

# Configuración de logging
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"
  file: "/app/logs/iot_middleware.log"
  max_size: "100MB"
  backup_count: 5

# Configuración de procesamiento de datos
processing:
  batch_size: 100
  max_workers: 4
  timeout: 30
  retry_attempts: 3
  retry_delay: 5

# Configuración de normalizadores
normalizers:
  temperature:
    unit: "celsius"
    min_value: -50
    max_value: 100
  humidity:
    unit: "percentage"
    min_value: 0
    max_value: 100
  pressure:
    unit: "hpa"
    min_value: 800
    max_value: 1200

# Configuración de almacenamiento
storage:
  timeseries:
    provider: "influxdb"
    retention_days: 30
  relational:
    provider: "postgresql"
    backup_enabled: true
    backup_interval: "1d"
  metadata:
    provider: "postgresql"
    cache_enabled: true
    cache_ttl: 3600

# Configuración de seguridad
security:
  mqtt:
    tls_enabled: false
    certificate_path: null
    private_key_path: null
  api:
    authentication_enabled: false
    jwt_secret: "your-secret-key-here"
    jwt_expiration: 3600
  database:
    ssl_mode: "disable"
    ssl_cert: null
    ssl_key: null
    ssl_ca: null

# Configuración de monitoreo
monitoring:
  health_check_interval: 30
  metrics_collection: true
  alerting:
    enabled: false
    webhook_url: null
    email:
      smtp_server: null
      smtp_port: 587
      username: null
      password: null
      from_email: null
      to_emails: []
