name: Quality Checks - IoT Middleware

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt
    
    - name: Run flake8
      run: |
        flake8 src/iot_middleware tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/iot_middleware tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run black check
      run: |
        black --check src/iot_middleware tests/
    
    - name: Run isort check
      run: |
        isort --check-only src/iot_middleware tests/
    
    - name: Run pylint
      run: |
        pylint src/iot_middleware/ --output-format=json --output=pylint-report.json || true
    
    - name: Run mypy
      run: |
        mypy src/iot_middleware/ --junit-xml=mypy-report.xml || true
    
    - name: Run bandit
      run: |
        bandit -r src/iot_middleware/ -f json -o bandit-report.json || true
    
    - name: Run safety
      run: |
        safety check --json --output safety-report.json || true
    
    - name: Upload quality reports
      uses: actions/upload-artifact@v3
      with:
        name: quality-reports-${{ matrix.python-version }}
        path: |
          pylint-report.json
          mypy-report.xml
          bandit-report.json
          safety-report.json






