name: Tests - IoT Middleware

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client redis-server
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt
    
    - name: Set up test database
      run: |
        sudo systemctl start postgresql
        sudo -u postgres psql -c "CREATE DATABASE test_db;"
        sudo -u postgres psql -c "CREATE USER test_user WITH PASSWORD 'test_pass';"
        sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE test_db TO test_user;"
    
    - name: Set up test environment
      run: |
        export TEST_ENV=true
        export TEST_DB_URL=postgresql://test_user:test_pass@localhost:5432/test_db
        export TEST_MQTT_BROKER=localhost:1883
        export TEST_INFLUXDB_URL=http://localhost:8086
        echo "TEST_ENV=true" >> $GITHUB_ENV
        echo "TEST_DB_URL=postgresql://test_user:test_pass@localhost:5432/test_db" >> $GITHUB_ENV
        echo "TEST_MQTT_BROKER=localhost:1883" >> $GITHUB_ENV
        echo "TEST_INFLUXDB_URL=http://localhost:8086" >> $GITHUB_ENV
    
    - name: Lint with flake8
      run: |
        flake8 src/iot_middleware tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/iot_middleware tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting with black
      run: |
        black --check src/iot_middleware tests/
    
    - name: Check import sorting with isort
      run: |
        isort --check-only src/iot_middleware tests/
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=src/iot_middleware --cov-report=xml --cov-report=term-missing
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --cov=src/iot_middleware --cov-append --cov-report=xml --cov-report=term-missing
    
    - name: Run security tests
      run: |
        pytest tests/security/ -v --cov=src/iot_middleware --cov-append --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Generate test report
      run: |
        pytest tests/ --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          reports/
          coverage.xml
          htmlcov/

  performance:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt
    
    - name: Run performance tests
      run: |
        pytest tests/performance/ -v --benchmark-only --benchmark-save=performance_results
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: .benchmarks/

  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt
    
    - name: Run security scan with bandit
      run: |
        bandit -r src/iot_middleware/ -f json -o bandit-report.json || true
    
    - name: Run safety check
      run: |
        safety check --json --output safety-report.json || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  quality:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt
    
    - name: Run pylint
      run: |
        pylint src/iot_middleware/ --output-format=json --output=pylint-report.json || true
    
    - name: Run mypy
      run: |
        mypy src/iot_middleware/ --junit-xml=mypy-report.xml || true
    
    - name: Upload quality reports
      uses: actions/upload-artifact@v3
      with:
        name: quality-reports
        path: |
          pylint-report.json
          mypy-report.xml
