# Configuración de Pre-commit para Pruebas - IoT Middleware
# ========================================================

repos:
  # Pre-commit hooks básicos
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        name: "Eliminar espacios en blanco al final"
      - id: end-of-file-fixer
        name: "Asegurar nueva línea al final del archivo"
      - id: check-yaml
        name: "Verificar sintaxis YAML"
      - id: check-json
        name: "Verificar sintaxis JSON"
      - id: check-toml
        name: "Verificar sintaxis TOML"
      - id: check-merge-conflict
        name: "Detectar conflictos de merge"
      - id: check-added-large-files
        name: "Detectar archivos grandes"
        args: ['--maxkb=1000']
      - id: check-case-conflict
        name: "Detectar conflictos de mayúsculas/minúsculas"
      - id: check-merge-conflict
        name: "Detectar conflictos de merge"
      - id: debug-statements
        name: "Detectar declaraciones de debug"
      - id: check-docstring-first
        name: "Verificar que los docstrings estén primero"

  # Black para formateo de código
  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        name: "Formatear código con Black"
        language_version: python3
        args: ['--line-length=88']

  # isort para ordenar imports
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: "Ordenar imports con isort"
        args: ['--profile', 'black', '--line-length', '88']

  # flake8 para linting
  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        name: "Linting con flake8"
        args: ['--max-line-length=88', '--extend-ignore=E203,W503']

  # pylint para análisis de código
  - repo: https://github.com/pycqa/pylint
    rev: v2.17.5
    hooks:
      - id: pylint
        name: "Análisis de código con pylint"
        args: ['--disable=C0114,C0116', '--max-line-length=88']

  # mypy para verificación de tipos
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.1
    hooks:
      - id: mypy
        name: "Verificación de tipos con mypy"
        additional_dependencies: [types-all]
        args: ['--ignore-missing-imports']

  # bandit para análisis de seguridad
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        name: "Análisis de seguridad con bandit"
        args: ['-r', 'src/', '-f', 'json', '-o', 'bandit-report.json']
        exclude: 'tests/'

  # safety para verificar dependencias
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.2
    hooks:
      - id: python-safety-dependencies-check
        name: "Verificar dependencias con safety"

  # pytest para ejecutar pruebas
  - repo: https://github.com/pre-commit/mirrors-pytest
    rev: v7.4.0
    hooks:
      - id: pytest
        name: "Ejecutar pruebas con pytest"
        args: ['tests/unit/', '-v', '--tb=short']
        additional_dependencies: [pytest-cov, pytest-mock]

  # coverage para verificar cobertura
  - repo: https://github.com/pre-commit/mirrors-coverage
    rev: v7.2.7
    hooks:
      - id: coverage
        name: "Verificar cobertura de código"
        args: ['--fail-under=80']

  # Hooks personalizados para el proyecto
  - repo: local
    hooks:
      - id: check-test-structure
        name: "Verificar estructura de pruebas"
        entry: bash -c 'find tests/ -name "test_*.py" | head -1 | xargs -I {} python -m py_compile {}'
        language: system
        files: '^tests/.*\.py$'

      - id: check-imports
        name: "Verificar imports del proyecto"
        entry: bash -c 'python -c "import sys; sys.path.insert(0, \"src\"); import iot_middleware"'
        language: system
        files: '^src/.*\.py$'

      - id: check-config-files
        name: "Verificar archivos de configuración"
        entry: bash -c 'python -c "import yaml; yaml.safe_load(open(\"tests/test_config.yaml\"))"'
        language: system
        files: '^tests/.*\.yaml$'

# Configuración global
default_stages: [commit, push]
fail_fast: false
minimum_pre_commit_version: '2.0.0'

# Configuración de CI
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false



