# Configuración de CodeClimate para Pruebas - IoT Middleware
# ========================================================

version: "2"

# Configuración de archivos
exclude_patterns:
  - "**/tests/**"
  - "**/migrations/**"
  - "**/venv/**"
  - "**/node_modules/**"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/.pytest_cache/**"
  - "**/htmlcov/**"
  - "**/reports/**"
  - "**/.benchmarks/**"

# Configuración de motores
engines:
  # Análisis de duplicación
  duplication:
    enabled: true
    config:
      languages:
        python:
          mass_threshold: 100

  # Análisis de complejidad
  complexity:
    enabled: true
    config:
      languages:
