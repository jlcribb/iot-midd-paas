[pytest]
# Configuración de pytest para IoT Middleware

# Directorios de pruebas
testpaths = tests

# Patrones de archivos de prueba
python_files = test_*.py *_test.py

# Patrones de clases de prueba
python_classes = Test*

# Patrones de funciones de prueba
python_functions = test_*

# Marcadores personalizados
markers =
    unit: Pruebas unitarias
    integration: Pruebas de integración
    performance: Pruebas de rendimiento
    security: Pruebas de seguridad
    slow: Pruebas lentas
    mqtt: Pruebas relacionadas con MQTT
    database: Pruebas relacionadas con base de datos
    api: Pruebas relacionadas con API
    input: Pruebas relacionadas con input
    config: Pruebas relacionadas con configuración

# Opciones de salida
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    -p no:pytest_postgresql
    -p no:pytest_redis

# Configuración de logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
asyncio_default_fixture_loop_scope = function

# Configuración de cobertura
# addopts = --cov=src/iot_middleware --cov-report=html --cov-report=term-missing

# Filtros de advertencias
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:sqlalchemy.*
    ignore::UserWarning:paho.*
    ignore::urllib3.exceptions.NotOpenSSLWarning
