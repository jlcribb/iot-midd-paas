# Configuración de SonarQube para Pruebas - IoT Middleware
# =======================================================

# Información del proyecto
sonar.projectKey=iot-middleware
sonar.projectName=IoT Middleware
sonar.projectVersion=1.0.0
sonar.organization=iot-middleware-org

# Configuración de archivos
sonar.sources=src/iot_middleware
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.exclusions=**/__pycache__/**,**/migrations/**,**/venv/**,**/node_modules/**

# Configuración de Python
sonar.python.version=3.8,3.9,3.10,3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml

# Configuración de cobertura
sonar.coverage.jacoco.xmlReportPaths=coverage.xml
sonar.coverage.exclusions=**/tests/**,**/migrations/**,**/venv/**

# Configuración de duplicación
sonar.cpd.python.minimumtokens=100
sonar.cpd.exclusions=**/tests/**,**/migrations/**

# Configuración de calidad
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Configuración de análisis
sonar.analysis.mode=publish
sonar.issuesReport.console.enable=true
sonar.issuesReport.html.enable=true
sonar.issuesReport.json.enable=true

# Configuración de reportes
sonar.report.export.path=sonar-report.json
sonar.report.export.format=json

# Configuración de métricas
sonar.metrics.include=**/*.py
sonar.metrics.exclusions=**/tests/**,**/migrations/**

# Configuración de reglas
sonar.python.pylint.reportPaths=pylint-report.json
sonar.python.bandit.reportPaths=bandit-report.json
sonar.python.mypy.reportPaths=mypy-report.xml

# Configuración de seguridad
sonar.security.hotspots.include=**/*.py
sonar.security.hotspots.exclusions=**/tests/**,**/migrations/**

# Configuración de vulnerabilidades
sonar.vulnerabilities.include=**/*.py
sonar.vulnerabilities.exclusions=**/tests/**,**/migrations/**

# Configuración de código duplicado
sonar.cpd.include=**/*.py
sonar.cpd.exclude=**/tests/**,**/migrations/**

# Configuración de complejidad
sonar.complexity.include=**/*.py
sonar.complexity.exclude=**/tests/**,**/migrations/**

