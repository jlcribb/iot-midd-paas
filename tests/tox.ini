# Configuración de Tox para Pruebas - IoT Middleware
# =================================================

[tox]
envlist = py38, py39, py310, py311, lint, format, security, coverage
isolated_build = True
skip_missing_interpreters = True

[testenv]
deps =
    -r requirements.txt
    -r tests/requirements-test.txt
commands =
    pytest tests/ -v --cov=src/iot_middleware --cov-report=term-missing --cov-report=xml
setenv =
    TEST_ENV = true
    PYTHONPATH = {toxinidir}/src

[testenv:lint]
deps =
    flake8
    pylint
    mypy
commands =
    flake8 src/iot_middleware tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
    flake8 src/iot_middleware tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    pylint src/iot_middleware/ --output-format=json --output=pylint-report.json
    mypy src/iot_middleware/ --junit-xml=mypy-report.xml

[testenv:format]
deps =
    black
    isort
commands =
    black --check src/iot_middleware tests/
    isort --check-only src/iot_middleware tests/

[testenv:security]
deps =
    bandit
    safety
commands =
    bandit -r src/iot_middleware/ -f json -o bandit-report.json
    safety check --json --output safety-report.json

[testenv:coverage]
deps =
    -r requirements.txt
    -r tests/requirements-test.txt
    coverage
commands =
    coverage run -m pytest tests/
    coverage report --fail-under=80
    coverage html
    coverage xml



